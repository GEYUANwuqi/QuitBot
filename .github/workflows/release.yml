name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches package version
        id: version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] != expected:
              raise SystemExit(f"Release requires the {expected} tag matching pyproject.toml")
          prerelease = bool(re.search(r"(?:a|b|rc|dev)[0-9]", version))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prerelease={str(prerelease).lower()}\n")

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download checked distributions and licenses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quitbot-windows-distributions
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          shopt -s failglob
          assets=(dist/*.whl dist/*.tar.gz dist/LICENSE dist/THIRD_PARTY_LICENSES.txt)
          test "${#assets[@]}" -eq 4
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "QuitBot $RELEASE_TAG" \
            --generate-notes --prerelease="$PRERELEASE"
