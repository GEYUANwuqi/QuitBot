[project]
name = "quitbot"
version = "0.14.0.dev2"
description = "Asynchronous QQ account service for Windows and Linux desktops"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-QuitBot-NonCommercial-NoRedistribution-1.0"
license-files = ["LICENSE"]
dependencies = [
    "uiautomation>=2.0.29; sys_platform == 'win32'",
    "comtypes>=1.4,<2; sys_platform == 'win32'",
    "PyGObject>=3.48,<3.51; sys_platform == 'linux'",
    "python-xlib>=0.33,<1; sys_platform == 'linux'",
    "Pillow>=10,<13; sys_platform == 'linux'",
    "websockets>=15,<17",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/dev", "/.local", "/config", "**/snowluma_catalog*.json", "**/napcat_catalog*.json"]
artifacts = ["/src/quitbot_backend/_webui/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quitbot_backend"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/frontend", "/scripts", "/hatch_build.py",
    "/.gitignore", "/.python-version", "/pyproject.toml", "/uv.lock",
    "/README.md", "/LICENSE", "/docs", "/protocol",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "httpx>=0.28,<1",
    "openapi-spec-validator>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["dev", ".local", "artifacts", "frontend"]
